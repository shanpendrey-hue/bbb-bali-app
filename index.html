<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#556B3F" />
  <meta name="description" content="Nicolle's 50th — The Big Bali Bash, Bali 2027" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <title>B.B.B — The Big Bali Bash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600;700&family=Allura&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <button class="brand-button" data-route="home" aria-label="Go home">
        <span class="brand-mark">B.B.B</span>
        <span class="brand-sub">BALI 2027</span>
      </button>
      <button class="menu-button" id="menuButton" aria-label="Open menu">☰</button>
    </header>

    <aside class="drawer" id="drawer" aria-hidden="true">
      <div class="drawer-card">
        <button class="drawer-close" id="drawerClose" aria-label="Close menu">×</button>
        <div class="drawer-title">THE BIG BALI BASH</div>
        <nav class="drawer-nav">
          <button data-route="home">Home</button>
          <button data-route="itinerary">Itinerary</button>
          <button data-route="bash">Big Bali Bash</button>
          <button data-route="recovery">Aussie Recovery</button>
          <button data-route="menus">Menus</button>
          <button data-route="bookings">Bookings</button>
          <button data-route="bali">Bali Guide</button>
          <button data-route="villa">Villa Info</button>
          <button data-route="contact">Contact Shan</button>
        </nav>
      </div>
    </aside>

    <main id="app" class="main"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-route="home" class="active"><span>⌂</span><small>Home</small></button>
      <button data-route="itinerary"><span>◷</span><small>Itinerary</small></button>
      <button data-route="bash"><span>✦</span><small>Bash</small></button>
      <button data-route="recovery"><span>☀</span><small>Recovery</small></button>
      <button data-route="bookings"><span>✓</span><small>Book</small></button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>
